[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doubao2-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "playwright",
    "pydantic-settings",
    "python-multipart",
    # FastMCP 只存在于 mcp 1.x；2.x 已将其重命名为 MCPServer。
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[project.scripts]
doubao2-api = "doubao2_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doubao2_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
